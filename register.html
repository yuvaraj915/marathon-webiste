<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FORM/42 — Under construction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fafafa;--ink:#171717;--muted:#737373}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font-family:"DM Sans",sans-serif;line-height:1.5;text-align:center}
.logo{font:400 26px/1 "Anton",sans-serif;text-transform:uppercase}
.logo span{color:var(--muted)}
h1{font:400 clamp(56px,13vw,150px)/.85 "Anton",sans-serif;text-transform:uppercase;margin:40px 0 24px}
p{max-width:420px;margin:0 auto;color:var(--muted)}
.bar{width:min(100%,320px);height:1px;background:var(--ink);margin:36px auto;transform-origin:center;animation:pulse 3s ease-in-out infinite}
a{display:inline-block;margin-top:8px;min-height:48px;line-height:48px;padding:0 24px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:12px;font-weight:700;text-decoration:none;text-transform:uppercase}
a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
@keyframes pulse{0%,100%{transform:scaleX(.2);opacity:.3}50%{transform:scaleX(1);opacity:1}}
@media(prefers-reduced-motion:reduce){.bar{animation:none}}
</style>
</head>
<body>
  <main>
    <div class="logo">FORM<span>/</span>42</div>
    <h1>Under<br>construction</h1>
    <p>We're building something new. Check back soon.</p>
    <div class="bar" aria-hidden="true"></div>
    <a href="mailto:hello@form42.in">Back to Home</a>
  </main>
</body>
</html>
